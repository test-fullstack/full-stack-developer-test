<!DOCTYPE html>
<html lang="en" class="wa-theme-awesome">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Products</title>
    <!-- Web Awesome Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/styles/webawesome.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <!-- Web Awesome Loader -->
    <script type="module">
        import { setBasePath, startLoader } from 'https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/webawesome.loader.js';
        setBasePath('https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn');
        startLoader();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>
                <wa-icon name="magnifying-glass" variant="solid"></wa-icon>
                Search Products
            </h1>
            <wa-button variant="success" href="/" class="back-button">
                <wa-icon name="arrow-left" slot="prefix"></wa-icon>
                Back to Products
            </wa-button>
        </header>
        
        <wa-divider></wa-divider>
        
        <div class="search-box">
            <wa-input label="Search Products"
                      id="searchInput"
                      placeholder="Search products by title..."
                      hx-get="/products/search"
                      hx-target="#product-table-container"
                      hx-swap="innerHTML"
                      hx-trigger="keyup changed delay:300ms"
                      name="query">
                <wa-icon name="magnifying-glass" slot="prefix"></wa-icon>
            </wa-input>
        </div>
        
        <div id="product-table-container"></div>
    </div>
    
    <div class="loading-overlay">
        <wa-spinner></wa-spinner>
    </div>
    
    <wa-dialog label="Success" id="deleteSuccessDialog" style="--width: 420px;">
        <div class="dialog-margin">
            <wa-icon name="circle-check" variant="solid" class="success-icon"></wa-icon>
            <p>Product "<span id="deletedProductTitle"></span>" has been deleted successfully.</p>
        </div>
        <wa-button slot="footer" variant="brand" data-dialog="close">OK</wa-button>
    </wa-dialog>
    
    <wa-dialog label="Delete Product" id="deleteDialog" style="--width: 420px;">
        <div class="dialog-margin">
            <p>Are you sure you want to delete "<span id="deleteProductTitle"></span>"?</p>
            <p class="warning-text">This action cannot be undone.</p>
        </div>
        <form id="deleteForm" method="post" style="display: none;"></form>
        <wa-button slot="footer" variant="neutral" data-dialog="close">
            <wa-icon name="xmark" slot="prefix"></wa-icon>
            Cancel
        </wa-button>
        <wa-button slot="footer" variant="danger" onclick="document.getElementById('deleteForm').requestSubmit()">
            <wa-icon name="trash-can" slot="prefix"></wa-icon>
            Delete
        </wa-button>
    </wa-dialog>
    
    <script src="/js/shared.js"></script>
    <script>
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (handleDeleteSuccess(event)) {
                const searchInput = document.getElementById('searchInput');
                if (searchInput && searchInput.value) {
                    setTimeout(function () { htmx.trigger(searchInput, 'input'); }, 100);
                }
            }
        });
        
        document.addEventListener('DOMContentLoaded', function () {
            htmx.ajax('GET', '/products/search?query=&sortBy=id&order=asc&page=0&pageSize=10', {
                target: '#product-table-container',
                swap: 'innerHTML'
            });
        });
        
        initSharedHandlers();
    </script>
</body>
</html>
