<!DOCTYPE html>
<html lang="en" class="wa-theme-awesome">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <!-- Web Awesome Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/styles/webawesome.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <!-- Web Awesome Loader -->
    <script type="module">
        import { setBasePath, startLoader } from 'https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn/webawesome.loader.js';
        setBasePath('https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.2.1/dist-cdn');
        startLoader();
    </script>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>
                    <wa-icon name="box-open" variant="solid"></wa-icon>
                    Products
                </h1>
                <div id="total-count-container" 
                     class="total-count"
                     hx-get="/products/total-count" 
                     hx-trigger="load, htmx:afterSwap from:#product-table-container"
                     hx-swap="innerHTML">
                    <span>Total Products in DB: <strong th:text="${totalCount}"></strong></span>
                </div>
            </div>
        </header>
        
        <wa-divider></wa-divider>
        
        <div class="button-group">
            <wa-button variant="brand" id="load-products-btn" hx-post="/products/load" hx-target="#product-table-container" hx-swap="innerHTML">
                <wa-icon name="download" slot="prefix"></wa-icon>
                Load Products
            </wa-button>
            <wa-button variant="brand" data-dialog="open addProductDialog">
                <wa-icon name="plus" slot="prefix"></wa-icon>
                Add New Product
            </wa-button>
            <wa-button variant="brand" href="/search">
                <wa-icon name="magnifying-glass" slot="prefix"></wa-icon>
                Search Products
            </wa-button>
        </div>
        
        <div id="product-table-container"></div>
    </div>
    
    <div class="loading-overlay">
        <wa-spinner></wa-spinner>
    </div>
    
    <wa-dialog label="Add New Product" id="addProductDialog" style="--width: 480px;">
        <form id="add-product-form" 
              method="post"
              action="/products?sortBy=id&order=asc&page=0&pageSize=10">
            <div class="form-group">
                <wa-input label="Title *" id="add-product-title" name="title" required autofocus></wa-input>
            </div>
            <div class="form-group">
                <wa-input label="Price" type="number" id="add-product-price" name="price" step="0.01"></wa-input>
            </div>
            <div class="form-group">
                <wa-input label="Vendor" id="add-product-vendor" name="vendor"></wa-input>
            </div>
        </form>
        <wa-button slot="footer" variant="neutral" data-dialog="close">
            <wa-icon name="xmark" slot="prefix"></wa-icon>
            Cancel
        </wa-button>
        <wa-button slot="footer" variant="brand" id="submit-add-product-btn" onclick="submitAddProductForm()">
            <wa-icon name="check" slot="prefix"></wa-icon>
            Add Product
        </wa-button>
    </wa-dialog>
    
    <wa-dialog label="Delete Product" id="deleteDialog" style="--width: 420px;">
        <div class="dialog-margin">
            <p>Are you sure you want to delete "<span id="deleteProductTitle"></span>"?</p>
            <p class="warning-text">This action cannot be undone.</p>
        </div>
        <form id="deleteForm" method="post" style="display: none;"></form>
        <wa-button slot="footer" variant="neutral" data-dialog="close">
            <wa-icon name="xmark" slot="prefix"></wa-icon>
            Cancel
        </wa-button>
        <wa-button slot="footer" variant="danger" onclick="document.getElementById('deleteForm').requestSubmit()">
            <wa-icon name="trash-can" slot="prefix"></wa-icon>
            Delete
        </wa-button>
    </wa-dialog>
    
    <wa-dialog label="Success" id="deleteSuccessDialog" style="--width: 420px;">
        <div class="dialog-margin">
            <wa-icon name="circle-check" variant="solid" class="success-icon"></wa-icon>
            <p>Product "<span id="deletedProductTitle"></span>" has been deleted successfully.</p>
        </div>
        <wa-button slot="footer" variant="brand" data-dialog="close">OK</wa-button>
    </wa-dialog>
    
    <script src="/js/shared.js"></script>
    <script>
        let isAddingProduct = false;
        
        function closeAddProductDialog() {
            const dialog = document.getElementById('addProductDialog');
            if (dialog) dialog.open = false;
        }
        
        function resetAddProductForm() {
            const form = document.getElementById('add-product-form');
            if (form) {
                form.reset();
                form.querySelectorAll('wa-input').forEach(function (input) {
                    input.value = '';
                });
            }
        }
        
        function submitAddProductForm() {
            const form = document.getElementById('add-product-form');
            if (!form) return;
            
            const titleInput = document.getElementById('add-product-title');
            const title = titleInput ? (titleInput.value || '') : '';
            
            if (!title.trim()) {
                if (titleInput) titleInput.focus();
                return;
            }
            
            isAddingProduct = true;
            
            htmx.ajax('POST', form.action, {
                target: '#product-table-container',
                swap: 'innerHTML',
                values: {
                    title: title,
                    price: document.getElementById('add-product-price').value || '',
                    vendor: document.getElementById('add-product-vendor').value || '',
                    sortBy: 'id',
                    order: 'asc',
                    page: '0',
                    pageSize: '10'
                }
            });
        }
        
        document.addEventListener('htmx:configRequest', function (event) {
            const requestPath = event.detail?.pathInfo?.requestPath;
            const triggerElement = event.detail?.elt;
            
            if (requestPath && requestPath.startsWith('/products') && 
                !requestPath.includes('/delete') && 
                !requestPath.includes('/load') &&
                !requestPath.includes('/search') &&
                !requestPath.includes('/update') &&
                !requestPath.includes('/edit') &&
                !requestPath.includes('/total-count')) {
                
                if (!isAddingProduct) {
                    const isFromInput = triggerElement && (
                        triggerElement.tagName === 'WA-INPUT' ||
                        triggerElement.closest('wa-input') ||
                        triggerElement.closest('#add-product-form') ||
                        (triggerElement.tagName === 'INPUT' && triggerElement.type !== 'submit' && triggerElement.closest('#add-product-form'))
                    );
                    
                    if (isFromInput) {
                        event.preventDefault();
                        return false;
                    }
                }
            }
        });
        
        document.body.addEventListener('htmx:afterSwap', function (event) {
            if (event.detail?.target?.id === 'product-table-container') {
                if (isAddingProduct && event.detail?.xhr?.status === 200) {
                    resetAddProductForm();
                    closeAddProductDialog();
                    isAddingProduct = false;
                }
                handleDeleteSuccess(event);
            }
        });
        
        initSharedHandlers();
    </script>
</body>
</html>
